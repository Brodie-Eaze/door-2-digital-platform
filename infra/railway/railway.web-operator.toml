# Railway service config — D2D Operator Console (Next.js)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web-operator"

[deploy]
startCommand = "node apps/web-operator/server.js"
healthcheckPath = "/login"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
