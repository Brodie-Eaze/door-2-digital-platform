# Railway service config — D2D API
#
# Deploy: `railway up --service api --detach`
# Or link this file via Railway dashboard → Service Settings → Config-as-Code.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "node apps/api/dist/src/index.js"
healthcheckPath = "/v1/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required env vars come from Railway dashboard / shared variables.
# See .env.example for the full list.
