# =============================================================================
# Railway service config — D2D API (Fastify) — STAGING
# =============================================================================
# Service name on Railway:  d2d-api-staging
# Branch tracked:           staging
# Port contract:            api = 3010  (web-operator = 3000)
#
# Link this file in Railway: Service → Settings → Config-as-Code → set path to
#   infra/railway/staging/railway.api.toml
# Or deploy ad hoc:  railway up --service d2d-api-staging --detach
#
# The API reads PORT from the environment (apps/api/src/config/env.ts, Zod,
# default 3010). Railway injects PORT automatically — DO NOT hardcode a PORT
# variable in the Railway dashboard or it will fight the injected value.
# Bind address is HOST=0.0.0.0 (Dockerfile default) so Railway's edge can reach it.
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "node apps/api/dist/src/index.js"
healthcheckPath = "/v1/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

# -----------------------------------------------------------------------------
# Service-to-service references (set in Railway dashboard → Variables, NOT here;
# config-as-code cannot hold secrets and gitleaks runs on commit). Use Railway's
# reference-variable syntax so URLs track the managed plugins automatically:
#
#   DATABASE_URL  = ${{ Postgres.DATABASE_URL }}
#   REDIS_URL     = ${{ Redis.REDIS_URL }}
#   CORS_ORIGINS  = https://${{ d2d-web-operator-staging.RAILWAY_PUBLIC_DOMAIN }}
#   API_BASE_URL  = https://${{ RAILWAY_PUBLIC_DOMAIN }}
#
# Full required/optional variable list: .env.staging.example + docs/STAGING-DEPLOY.md
# -----------------------------------------------------------------------------
