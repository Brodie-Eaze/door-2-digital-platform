# Railway service config — D2D public marketing site (Next.js)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.public-site"

[deploy]
startCommand = "node apps/public-site/server.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
