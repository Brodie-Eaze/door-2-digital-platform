packages:
  - 'apps/*'
  - 'packages/*'

# Security overrides — transitive CVE floors (Trivy HIGH findings 2026-08-21).
overrides:
  # Bare names: versioned selector keys do not defeat exact pins (next@15/16
  # pins postcss@8.4.31 exactly), so these force the floor everywhere.
  nanoid: '>=3.3.18'
  postcss: '>=8.5.18'
  fast-uri: '>=3.1.5'
  form-data: '>=4.0.6'
  sharp: '>=0.35.0'
  '@opentelemetry/propagator-jaeger': '>=2.9.0'
