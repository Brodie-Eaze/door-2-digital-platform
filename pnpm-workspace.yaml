packages:
  - 'apps/*'
  - 'packages/*'

# Security overrides — transitive CVE floors (Trivy HIGH findings 2026-08-21).
overrides:
  # Bare names: versioned selector keys do not defeat exact pins (next pins
  # postcss exactly). package.json pnpm.overrides is the pnpm 9 home; this
  # block is the pnpm 10 home — keep both in sync.
  nanoid: '>=3.3.18'
  postcss: '>=8.5.18'
  fast-uri: '>=3.1.5'
  form-data: '>=4.0.6'
  sharp: '>=0.35.0'
  '@opentelemetry/propagator-jaeger': '>=2.9.0'
