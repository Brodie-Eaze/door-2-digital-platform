name: Deploy (Railway)

on:
  push:
    branches: [main]
    tags: ['staging-*', 'prod-*']

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/prod-') && 'production' || startsWith(github.ref, 'refs/tags/staging-') && 'staging' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "TODO Phase 0 ops: wire Railway CLI deploy here once RAILWAY_TOKEN"
